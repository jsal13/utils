<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Template</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            /* Color Palette */
            --primary: #044389;
            --primary-dark: #032d5f;
            --primary-light: #0659b8;
            --secondary: #64748b;
            --secondary-light: #94a3b8;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --accent: #e6f1ff;
            --border: #e2e8f0;
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
            
            /* Typography */
            --font-serif: 'Lora', serif;
            --font-sans: 'Manrope', sans-serif;
            
            /* Spacing */
            --space-xs: 0.5rem;
            --space-sm: 0.75rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
            
            /* Layout */
            --container-max: 1200px;
            --border-radius: 0.5rem;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
            font-size: 16px;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-serif);
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: var(--space-md);
        }

        h1 { font-size: 2.5rem; }
        h2 { font-size: 2rem; }
        h3 { font-size: 1.5rem; }
        h4 { font-size: 1.25rem; }
        h5 { font-size: 1.125rem; }
        h6 { font-size: 1rem; }

        p {
            margin-bottom: var(--space-md);
        }

        /* Layout Components */
        .container {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 0 var(--space-md);
        }

        /* Header */
        .header {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: var(--space-md) 0;
        }

        .logo {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--primary);
            text-decoration: none;
        }

        .nav {
            display: flex;
            gap: var(--space-lg);
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--primary);
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-primary);
        }

        /* Main Layout */
        .main {
            min-height: calc(100vh - 120px);
            padding: var(--space-xl) 0;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--space-xl);
        }

        .main-grid.with-sidebar {
            grid-template-columns: 1fr 300px;
        }

        /* Content Areas */
        .content {
            background: var(--surface);
            padding: var(--space-xl);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .sidebar {
            background: var(--surface);
            padding: var(--space-lg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            height: fit-content;
        }

        /* App Content Area - This is where you'll paste your app content */
        .app-container {
            background: var(--surface);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: var(--space-xl);
            margin: var(--space-xl) 0;
        }

        /* Utility Components */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            padding: var(--space-sm) var(--space-lg);
            border: none;
            border-radius: var(--border-radius);
            font-family: var(--font-sans);
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--secondary);
            color: white;
        }

        .btn-secondary:hover {
            background: var(--text-primary);
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        /* Cards */
        .card {
            background: var(--surface);
            padding: var(--space-lg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .card-header {
            margin-bottom: var(--space-md);
            padding-bottom: var(--space-md);
            border-bottom: 1px solid var(--border);
        }

        .card-title {
            font-size: 1.25rem;
            margin-bottom: var(--space-xs);
        }

        /* Footer */
        .footer {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: var(--space-lg) 0;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            :root {
                --space-xl: 1.5rem;
                --space-2xl: 2rem;
            }

            h1 { font-size: 2rem; }
            h2 { font-size: 1.75rem; }
            h3 { font-size: 1.375rem; }

            .nav {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: var(--surface);
                flex-direction: column;
                padding: var(--space-md);
                box-shadow: var(--shadow-lg);
                border-top: 1px solid var(--border);
            }

            .nav.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
            }

            .main-grid.with-sidebar {
                grid-template-columns: 1fr;
            }

            .sidebar {
                order: -1;
            }

            .content,
            .app-container {
                padding: var(--space-lg);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 var(--space-sm);
            }

            .content,
            .app-container {
                padding: var(--space-md);
            }
        }

        /* Utility Classes */
        .text-center { text-align: center; }
        .text-right { text-align: right; }
        .text-muted { color: var(--text-secondary); }
        .text-primary { color: var(--primary); }
        .bg-accent { background-color: var(--accent); }
        .mt-0 { margin-top: 0; }
        .mb-0 { margin-bottom: 0; }
        .hidden { display: none; }
        .flex { display: flex; }
        .flex-center { display: flex; align-items: center; justify-content: center; }
        .gap-sm { gap: var(--space-sm); }
        .gap-md { gap: var(--space-md); }
        .gap-lg { gap: var(--space-lg); }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="#" class="logo">Your App</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            <!-- App Container - Replace this section with your app content -->
            <section class="app-container">
                <div class="card-header">
                    <h2 class="card-title">Your App Goes Here</h2>
                    <p class="text-muted mb-0">Paste your web application content in this container</p>
                </div>
                
                <!-- Sample content - replace with your app -->
                <div class="main-grid">
                    <div class="content">
                        <h3>Main Content Area</h3>
                        <p>This is where your primary app content will go. The layout is flexible and responsive.</p>
                        
                        <div class="card">
                            <h4>Feature Card</h4>
                            <p>Use cards to organize different sections of your app or display information clearly.</p>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- JavaScript for Mobile Menu -->
    <script>
        // Mobile menu toggle
        const menuToggle = document.getElementById('menu-toggle');
        const nav = document.getElementById('nav');

        menuToggle.addEventListener('click', () => {
            nav.classList.toggle('active');
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!nav.contains(e.target) && !menuToggle.contains(e.target)) {
                nav.classList.remove('active');
            }
        });

        // Close mobile menu when window is resized to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                nav.classList.remove('active');
            }
        });
    </script>
</body>
</html>
